<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 기본 메타 태그 -->
    <title>puff studio</title>
    <meta name="description" content="puff studio - 상업 포토그래피 및 미디어 영상 제작 스튜디오" />
    
    <!-- 오픈 그래프 (카카오톡, 페이스북, 인스타그램 등 공유 시 미리보기) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.puff-studio.com/" />
    <meta property="og:site_name" content="puff studio" />
    <meta property="og:title" content="puff studio" />
    <meta property="og:description" content="puff studio - 상업 포토그래피 및 미디어 영상 제작 스튜디오" />
    <meta property="og:image" content="https://www.puff-studio.com/camera_white.jpg" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />

    <!-- 트위터 미리보기 (Twitter Card Meta Tags) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@puffstudio" />
    <meta name="twitter:creator" content="@puffstudio" />
    <meta name="twitter:title" content="puff studio" />
    <meta name="twitter:description" content="puff studio - 상업 포토그래피 및 미디어 영상 제작 스튜디오" />
    <meta name="twitter:image" content="https://www.puff-studio.com/camera_white.jpg" />

    <!-- 폰트 preconnect + 미리 로드 (인스타그램 인앱 브라우저 등에서 초기 렌더링 지연 방지) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
